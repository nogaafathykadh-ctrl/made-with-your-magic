<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a6b63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="صُنِعَ بِسِحْرِكِ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>صُنِعَ بِسِحْرِكِ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef2f0; --surface:#fafcfb; --fg:#12302d; --muted:#56706b; --line:#d3dedb;
  --accent:#0a6b63; --accent-fg:#ffffff; --gold:#a8741a; --ok:#1f7a4d; --bad:#a63a2f; --key:#ffffff; --key-fg:#12302d;
  --font-display:'Aref Ruqaa','Amiri',serif; --font-body:'Tajawal','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a19; --surface:#132422; --fg:#e2eeea; --muted:#8fa8a2; --line:#25403c;
    --accent:#4fc3b4; --accent-fg:#06201d; --gold:#e0b252; --ok:#5bc98f; --bad:#ee8a7e; --key:#e6efec; --key-fg:#0d1a19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a19; --surface:#132422; --fg:#e2eeea; --muted:#8fa8a2; --line:#25403c;
  --accent:#4fc3b4; --accent-fg:#06201d; --gold:#e0b252; --ok:#5bc98f; --bad:#ee8a7e; --key:#e6efec; --key-fg:#0d1a19;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:400 17px/1.7 var(--font-body);
  padding-block:20px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;line-height:1.35}
h1{font:700 40px/1.75 var(--font-display)}
h2{font:700 30px/1.35 var(--font-display)}
h3{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.btn{
  font:500 16px/1.4 var(--font-body); color:var(--fg); background:var(--surface);
  border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-height:44px;
  cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; text-decoration:none;
}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:focus-visible,.row:focus-visible,.note:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn svg{width:14px;height:14px;fill:currentColor}

.head p{margin-top:6px}
.prog{display:flex;flex-direction:column;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.level{display:flex;flex-direction:column;gap:8px}
.level h3{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:15px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr 28px;gap:12px;align-items:center;padding:14px 16px;color:var(--fg);text-decoration:none;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700;font-size:18px}
.row b{display:block;font-size:18px}
.row small{color:var(--muted);font-size:14px;display:block;line-height:1.5}
.row .chk{color:var(--ok);display:flex;justify-content:center}
.row .chk svg{width:20px;height:20px}

.back{align-self:flex-start}
.pill{display:inline-block;font-size:13px;padding:2px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.notes{display:flex;direction:ltr}
.note{
  flex:1 1 0; min-width:0; margin:0 2px; padding:8px 0 10px; border-radius:10px;
  border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--font-body);
  transition:transform .12s, background .12s;
}
.note .deg{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.note .nm{font-size:clamp(11px,3.3vw,16px);font-weight:700;line-height:1.4;white-space:nowrap}
.note.q{border-bottom:3px solid var(--gold)}
.note.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);transform:translateY(-3px)}
.note.on .deg{color:var(--accent-fg)}
.gaps{display:flex;direction:ltr;padding-inline:calc(100% / (2 * var(--n)));margin-top:-6px}
.gaps span{flex:1 1 0;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.gaps span.q{color:var(--gold);font-weight:700}
.legend{font-size:14px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px}
.facts{display:flex;flex-direction:column;gap:12px}
.fact{display:flex;flex-direction:column;gap:2px}
.fact h3{font-size:15px;color:var(--accent)}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:500 16px/1.5 var(--font-body);text-align:start;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.fb{min-height:1.6em;font-weight:700}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.foot{display:flex;flex-direction:column;gap:10px}

/* تصميم البيانو التفاعلي */
.piano-box{display:flex;flex-direction:column;gap:8px}
.piano-keys{display:flex;direction:ltr;gap:4px;justify-content:center}
.p-key{
  flex:1 1 0; min-width:0; height:170px; background:var(--key); color:var(--key-fg);
  border:1px solid var(--line); border-radius:0 0 12px 12px; cursor:pointer;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  padding:0 0 12px; font-family:var(--font-body); font-weight:700;
  font-size:clamp(11px,3.4vw,17px); line-height:1.3;
  touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
  transition:background .1s, transform .1s;
}
.p-key.q{border-top:6px solid var(--gold)}
.p-key:active,.p-key.active{background:var(--accent); color:var(--accent-fg); transform:scaleY(0.97); transform-origin:top}
.p-key:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
@media (min-width:480px){.p-key{height:200px}}

.lock-screen{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; padding:30px 20px; background:var(--surface); border:1px solid var(--line);
  border-radius:16px; margin-top:40px; text-align:center;
}
.pass-input{
  width:100%; max-width:320px; padding:12px 16px; font-size:18px; text-align:center;
  border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg);
  font-family:inherit; outline:none;
}
.pass-input:focus{border-color:var(--accent);}

@media (prefers-reduced-motion:reduce){.note{transition:none}}
</style>

</head>
<body>
<div class="wrap" dir="rtl" lang="ar">
<div id="lock">
<form id="lockForm" class="lock-screen" autocomplete="off">
<h1>صُنِعَ بِسِحْرِكِ</h1>
<p class="muted">طلاب دورة المقامات فقط. أدخلي كلمة السر للدخول:</p>
<input type="password" id="pw" class="pass-input" aria-label="كلمة السر" placeholder="أدخل كلمة السر هنا" autocomplete="current-password">
<button class="btn primary" type="submit" id="go">دخول التطبيق</button>
<p class="fb no" id="lockFb" role="alert"></p>
</form>
</div>
</div>

var KEYNAME='maqamat-key';
var lock=document.getElementById('lock'),appEl=document.getElementById('app');
var form=document.getElementById('lockForm'),pw=document.getElementById('pw'),go=document.getElementById('go'),fb=document.getElementById('lockFb');
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function hasCrypto(){return !!(window.crypto&&crypto.subtle);}
async function deriveKey(p){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
  var code=new TextDecoder().decode(buf);
  lock.hidden=true;appEl.hidden=false;
  var sc=document.createElement('script');sc.text=code;document.body.appendChild(sc);
}
form.addEventListener('submit',async function(e){
  e.preventDefault();
  fb.textContent='';
  if(!hasCrypto()){fb.textContent='افتحي التطبيق من رابط يبدأ بـ https.';return;}
  go.disabled=true;go.textContent='جاري التحقق...';
  var key;
  try{key=await deriveKey(pw.value);await openWith(key);}
  catch(err){fb.textContent='كلمة السر غير صحيحة، حاولي مرة أخرى.';go.disabled=false;go.textContent='دخول التطبيق';return;}
  try{localStorage.setItem(KEYNAME,JSON.stringify(await crypto.subtle.exportKey('jwk',key)));}catch(_){}
});
(async function(){
  if(!hasCrypto())return;
  try{
    var j=localStorage.getItem(KEYNAME);if(!j)return;
    var key=await crypto.subtle.importKey('jwk',JSON.parse(j),'AES-GCM',false,['decrypt']);
    await openWith(key);
  }catch(e){try{localStorage.removeItem(KEYNAME);}catch(_){}}
})();
})();
